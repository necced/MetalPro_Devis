<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne - MetalPro Devis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      text-align: center;
      max-width: 400px;
      background: white;
      border-radius: 1rem;
      padding: 2.5rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 40px; height: 40px; color: white; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }
    p { color: #64748b; line-height: 1.6; margin-bottom: 1.5rem; }
    .retry-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover { background: #1d4ed8; }
    .offline-note {
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      MetalPro Devis fonctionne en mode hors ligne. Vos données sont stockées localement
      et seront synchronisées automatiquement dès le retour de la connexion.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      Réessayer
    </button>
    <div class="offline-note">
      Les devis, clients et matériaux restent accessibles en lecture et écriture.
    </div>
  </div>
  <script>
    // Auto-retry when connection restored
    window.addEventListener('online', () => {
      window.location.reload();
    });

    // Show online status
    if (navigator.onLine) {
      document.querySelector('.offline-note').textContent = 'Connexion rétablie. Redirection...';
      setTimeout(() => window.location.reload(), 1000);
    }
  </script>
</body>
</html>
